<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> | Buscador de Perfil | </title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/ae4c9b0524.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <i class="fa-solid fa-magnifying-glass"></i>
    <span>Perfil Search</span>
  </header>
  <main>
    <div class="content">
      <h1>Searching on GitHub</h1>
      <div class="infoSearch">
        <input type="text" id="search" placeholder="Type your search...">
        <button id="btnSearch">Search</button>
      </div>
      <p id="feedback"></p>
    </div>
    <div class="container">
      <img src="assets/pexels-nataliia-kotovych-2162534794-38775159.jpg" id="img" alt="Perfil Image">
      <div class="infoUser">
        <h2 id="userName"></h2>
        <p id="bio"></p>
        <span id="repository"></span>
      </div>
    </div>
  </main>
  <footer>
    <p>Created By Marcos Paulo.</p>
    <p>&copy;Direitos Reservados.</p>
  </footer>


  <script src="script.js"></script>
</body>
</html>
